# WindWise — Render deployment configuration
# https://render.com/docs/render-yaml
services:
  - type: web
    name: windwise-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: FORECAST_CUTOFF_HOUR
        value: "9"
      - key: FORECAST_CUTOFF_MINUTE
        value: "20"
      - key: CORS_ORIGINS
        value: "https://your-vercel-app.vercel.app"
      - key: ENVIRONMENT
        value: production
