version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windwise-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      - FORECAST_CUTOFF_HOUR=${FORECAST_CUTOFF_HOUR:-9}
      - FORECAST_CUTOFF_MINUTE=${FORECAST_CUTOFF_MINUTE:-20}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://frontend
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: windwise-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: windwise-network
